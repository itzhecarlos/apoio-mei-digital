<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apoio MEI Digital | Status do pagamento</title>
    <meta name="description" content="Status do pagamento e instruções de conclusão." />
    <link rel="icon" href="logo.ico" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page-shell">
    <header class="simple-header">
      <div class="container">
        <a class="brand" href="./index.html">Apoio MEI Digital</a>
        <a href="./index.html">Voltar para a página inicial</a>
      </div>
    </header>

    <main class="lead-page">
      <section class="section">
        <div class="container">
          <div class="lead-wrapper">
            <div class="lead-intro">
              <p class="badge badge-light">Pagamento</p>
              <h1 id="status-title">Processando confirmação</h1>
              <p id="status-msg" style="margin-top: 8px;">
                Estamos preparando as instruções do seu pagamento.
              </p>
              <div id="pix-actions" class="hero-actions">
                <button id="copy-btn" class="btn btn-outline-dark" type="button">
                  Copiar código Pix
                </button>
                <a id="pay-link" class="btn" href="#" target="_blank" rel="noopener noreferrer">
                  Abrir QR Code
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-bottom">
        <p>&copy; <span id="year"></span> Apoio MEI Digital. Todos os direitos reservados.</p>
        <p>Serviço privado e independente. Sem vínculo com órgãos públicos.</p>
      </div>
    </footer>

    <script src="/site-config.js"></script>
    <script type="module" src="./enviado.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
